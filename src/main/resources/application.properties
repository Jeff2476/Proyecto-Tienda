spring.application.name=tienda
server.port=80

# Conexión a MySQL: usar variables de entorno para no publicar credenciales
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/techshop}
spring.datasource.username=${DB_USER:usuario_prueba}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG

# Configuración utilizada por los recursos de Firebase; el JSON privado no se publica
firebase.bucket.name=${FIREBASE_BUCKET:techshop-a8349.firebasestorage.app}
firebase.storage.path=${FIREBASE_STORAGE_PATH:}
firebase.json.path=${FIREBASE_JSON_PATH:firebase}
firebase.json.file=${FIREBASE_JSON_FILE:firebase-service-account.json}

# URL utilizada por el proceso de activación de usuarios
servidor.http=${SERVIDOR_HTTP:http://localhost}
